<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница TMKECuDDHUN6</title>
    <style>
        :root {
            --bg-base: #0C0D0E;
            --bg-surface: #131517;
            --bg-hover: #1B1E21;
            --text-primary: #e2e5ed;
            --text-secondary: #8b90a0;
            --text-muted: #555970;
            --accent: #8b90a0;
            --accent-soft: rgba(139, 144, 160, 0.14);
            --border: rgba(255, 255, 255, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        ::selection {
            background: #8b90a0;
            color: #fff;
        }

        ::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background-color: rgba(139, 144, 160, 0.3);
            background-clip: content-box;
            border: 4px solid transparent;
            border-radius: 8px;
            min-height: 44px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(139, 144, 160, 0.55);
            background-clip: content-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
            color: var(--text-primary);
            font-family: "Segoe UI", sans-serif;
        }

        .page-badge {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 60;
            padding: 8px 18px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-primary);
            white-space: nowrap;
        }

        .view {
            flex: 1;
            min-height: 0;
            display: flex;
            overflow-y: auto;
            padding: 80px 22px 56px;
        }

        .card {
            width: 100%;
            max-width: 640px;
            margin: auto;
            padding: 32px 36px 28px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .data-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .data-box {
            padding: 16px 18px;
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: "Consolas", monospace;
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-secondary);
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .meta {
            margin-top: 22px;
            font-size: 12px;
            letter-spacing: 0.3px;
            color: var(--text-muted);
        }

        .version-label {
            position: fixed;
            left: 50%;
            bottom: 6px;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
        }

        @media (max-width: 520px) {
            .card {
                padding: 24px 20px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="page-badge">Страница #TMKECuDDHUN6</div>
    <main class="view">
        <section class="card">
            <div class="data-title">Данные из C++</div>
            <div class="data-box">Привет! Это данные из C++ программы. Статус системы: OK. Версия: 1.0.5</div>
            <div class="meta">Создано: 16.10.2026, 14:21:36</div>
        </section>
    </main>
    <div class="version-label">Moolonic Cloude</div>
</body>
</html>
