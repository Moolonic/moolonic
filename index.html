<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Moolonic Cloud</title>
    <style>
        :root {
            --bg-base: #0C0D0E;
            --bg-surface: #131517;
            --bg-hover: #1B1E21;
            --text-primary: #e2e5ed;
            --text-secondary: #8b90a0;
            --text-muted: #555970;
            --accent: #8b90a0;
            --chart: #f6821f;
            --ok: #5fd38d;
            --bad: #ff7a6e;
            --border: rgba(255, 255, 255, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        [hidden] {
            display: none !important;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            background: var(--bg-base);
            color: var(--text-primary);
            font-family: "Segoe UI", sans-serif;
        }

        .lock-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 22px;
        }

        .panel {
            width: 100%;
            max-width: 380px;
            padding: 28px 26px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            text-align: center;
        }

        .title {
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 18px;
        }

        .input {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: "Consolas", monospace;
            font-size: 18px;
            letter-spacing: 4px;
            text-align: center;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.15s;
        }

        .input:focus {
            border-color: #8b90a0;
        }

        .button {
            padding: 10px 18px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #fff;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .button:hover {
            background: rgba(139, 144, 160, 0.14);
            color: var(--accent);
        }

        .button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .error {
            min-height: 18px;
            margin-top: 12px;
            font-size: 12px;
            color: var(--bad);
        }

        .dash {
            max-width: 1100px;
            margin: 0 auto;
            padding: 22px 22px 56px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }

        .brand {
            font-size: 16px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .updated {
            font-size: 12px;
            color: var(--text-muted);
        }

        .ghost {
            padding: 7px 14px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .ghost:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }

        .stat {
            padding: 16px 18px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .stat-label {
            font-size: 11px;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .stat-value {
            margin-top: 6px;
            font-family: "Consolas", monospace;
            font-size: 28px;
            color: var(--text-primary);
        }

        .card {
            margin-bottom: 12px;
            padding: 18px 20px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .tabs {
            display: flex;
            gap: 4px;
            padding: 3px;
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .tab {
            padding: 5px 12px;
            background: transparent;
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .tab:hover {
            color: var(--text-primary);
        }

        .tab.active {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .chart-wrap {
            position: relative;
            width: 100%;
        }

        .chart-wrap svg {
            display: block;
        }

        .tooltip {
            position: absolute;
            z-index: 5;
            padding: 8px 12px;
            background: #1B1E21;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            font-size: 12px;
            line-height: 1.5;
            white-space: nowrap;
            pointer-events: none;
        }

        .tooltip-time {
            color: var(--text-secondary);
        }

        .tooltip-value {
            color: var(--text-primary);
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 560px;
        }

        th {
            padding: 8px 10px;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.5px;
            text-align: left;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 10px;
            font-size: 13px;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .mono {
            font-family: "Consolas", monospace;
        }

        .pass-cell {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .copy {
            padding: 3px 8px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: inherit;
            font-size: 11px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .copy:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .badge {
            display: inline-block;
            padding: 2px 9px;
            border-radius: 999px;
            font-size: 11px;
        }

        .badge.active {
            background: rgba(95, 211, 141, 0.12);
            color: var(--ok);
        }

        .badge.expired {
            background: rgba(139, 144, 160, 0.14);
            color: var(--text-secondary);
        }

        .badge.deleted {
            background: rgba(255, 122, 110, 0.12);
            color: var(--bad);
        }

        .empty {
            padding: 22px 0 8px;
            font-size: 13px;
            text-align: center;
            color: var(--text-muted);
        }

        @media (max-width: 820px) {
            .cards {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 520px) {
            .dash {
                padding: 16px 12px 48px;
            }

            .updated {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="lock-wrap" id="lock">
        <main class="panel">
            <h1 class="title">Введите пароль</h1>
            <form class="form" id="form">
                <input class="input" id="password" type="password" autocomplete="off" autofocus>
                <button class="button" id="submit" type="submit">Открыть</button>
            </form>
            <div class="error" id="error"></div>
        </main>
    </div>

    <div class="dash" id="dash" hidden>
        <header class="topbar">
            <div class="brand">Moolonic Cloud</div>
            <div class="topbar-right">
                <span class="updated" id="updated"></span>
                <button class="ghost" id="logout" type="button">Выйти</button>
            </div>
        </header>

        <section class="cards" id="cards"></section>

        <section class="card">
            <div class="card-head">
                <h2 class="card-title">Новые ссылки</h2>
                <div class="tabs" id="tabs">
                    <button class="tab active" type="button" data-range="24h">24 часа</button>
                    <button class="tab" type="button" data-range="7d">7 дней</button>
                    <button class="tab" type="button" data-range="30d">30 дней</button>
                </div>
            </div>
            <div class="chart-wrap" id="chartWrap">
                <svg id="chart"></svg>
                <div class="tooltip" id="tooltip" hidden></div>
            </div>
        </section>

        <section class="card">
            <div class="card-head">
                <h2 class="card-title">Последние страницы</h2>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Код</th>
                            <th>Пароль</th>
                            <th>Создана</th>
                            <th>Удаляется</th>
                            <th>Статус</th>
                        </tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
            </div>
            <div class="empty" id="empty" hidden>Пока нет созданных страниц</div>
        </section>
    </div>

    <script>
        var WORKER_URL = "https://moolonic.maksimovdenis5702.workers.dev/";
        var REFRESH_MS = 30000;
        var HOUR = 3600000;
        var DAY = 86400000;
        var RANGES = {
            "24h": { count: 24, step: HOUR },
            "7d": { count: 28, step: 6 * HOUR },
            "30d": { count: 30, step: DAY }
        };
        var STATUS_LABELS = { active: "Активна", expired: "Истекла", deleted: "Удалена" };

        var password = "";
        var timer = null;
        var state = { range: "24h", now: Date.now(), times: [], recent: [], active: 0, total: 0 };

        var lockBox = document.getElementById("lock");
        var dash = document.getElementById("dash");
        var form = document.getElementById("form");
        var input = document.getElementById("password");
        var button = document.getElementById("submit");
        var errorBox = document.getElementById("error");
        var tooltip = document.getElementById("tooltip");

        function pad(n) {
            return n < 10 ? "0" + n : String(n);
        }

        function formatDate(ms) {
            var d = new Date(ms);
            return pad(d.getDate()) + "." + pad(d.getMonth() + 1) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
        }

        function formatShortDate(ms) {
            var d = new Date(ms);
            return pad(d.getDate()) + "." + pad(d.getMonth() + 1);
        }

        function formatHour(ms) {
            return pad(new Date(ms).getHours()) + ":00";
        }

        function alignEnd(now, step) {
            if (step === DAY) {
                var d = new Date(now);
                d.setHours(24, 0, 0, 0);
                return d.getTime();
            }
            return Math.ceil(now / step) * step;
        }

        function buildBuckets(times, key, now) {
            var cfg = RANGES[key];
            var end = alignEnd(now, cfg.step);
            var start = end - cfg.count * cfg.step;
            var buckets = [];
            for (var i = 0; i < cfg.count; i++) {
                buckets.push({ from: start + i * cfg.step, to: start + (i + 1) * cfg.step, value: 0 });
            }
            times.forEach(function (t) {
                if (t >= start && t < end) buckets[Math.floor((t - start) / cfg.step)].value++;
            });
            return buckets;
        }

        function svgEl(name, attrs) {
            var el = document.createElementNS("http://www.w3.org/2000/svg", name);
            Object.keys(attrs).forEach(function (k) {
                el.setAttribute(k, attrs[k]);
            });
            return el;
        }

        function bucketLabel(bucket, index, key) {
            if (key === "24h") return index % 4 === 0 ? formatHour(bucket.from) : "";
            if (key === "7d") return new Date(bucket.from).getHours() === 0 ? formatShortDate(bucket.from) : "";
            return index % 5 === 0 ? formatShortDate(bucket.from) : "";
        }

        function tooltipTitle(bucket, key) {
            if (key === "30d") return formatShortDate(bucket.from);
            return formatDate(bucket.from) + " – " + formatHour(bucket.to);
        }

        function drawChart() {
            var svg = document.getElementById("chart");
            var wrap = document.getElementById("chartWrap");
            var W = wrap.clientWidth || 700;
            var H = 260;
            var padL = 34;
            var padR = 6;
            var padT = 10;
            var padB = 26;
            var innerW = W - padL - padR;
            var innerH = H - padT - padB;

            svg.setAttribute("width", W);
            svg.setAttribute("height", H);
            svg.setAttribute("viewBox", "0 0 " + W + " " + H);
            while (svg.firstChild) svg.removeChild(svg.firstChild);

            var buckets = buildBuckets(state.times, state.range, state.now);
            var peak = 0;
            buckets.forEach(function (b) {
                if (b.value > peak) peak = b.value;
            });
            var top = Math.max(4, Math.ceil(peak / 4) * 4);

            for (var i = 0; i <= 4; i++) {
                var y = padT + innerH - (innerH * i) / 4;
                svg.appendChild(svgEl("line", {
                    x1: padL, x2: W - padR, y1: y, y2: y,
                    stroke: "rgba(255,255,255,0.06)", "stroke-width": 1
                }));
                var tick = svgEl("text", {
                    x: padL - 8, y: y + 4, "text-anchor": "end",
                    "font-size": 10, fill: "#555970"
                });
                tick.textContent = String((top * i) / 4);
                svg.appendChild(tick);
            }

            var slot = innerW / buckets.length;
            var barW = Math.max(2, slot * 0.7);

            buckets.forEach(function (bucket, index) {
                var x = padL + index * slot;
                var h = (innerH * bucket.value) / top;
                var bar = svgEl("rect", {
                    x: x + (slot - barW) / 2,
                    y: padT + innerH - h,
                    width: barW,
                    height: h,
                    rx: 2,
                    fill: "#f6821f",
                    opacity: 0.85
                });
                svg.appendChild(bar);

                var label = bucketLabel(bucket, index, state.range);
                if (label) {
                    var text = svgEl("text", {
                        x: x + slot / 2, y: H - 8, "text-anchor": "middle",
                        "font-size": 10, fill: "#555970"
                    });
                    text.textContent = label;
                    svg.appendChild(text);
                }

                var zone = svgEl("rect", {
                    x: x, y: padT, width: slot, height: innerH, fill: "transparent"
                });
                zone.addEventListener("mouseenter", function () {
                    bar.setAttribute("opacity", 1);
                    tooltip.textContent = "";
                    var time = document.createElement("div");
                    time.className = "tooltip-time";
                    time.textContent = tooltipTitle(bucket, state.range);
                    var value = document.createElement("div");
                    value.className = "tooltip-value";
                    value.textContent = "Создано: " + bucket.value;
                    tooltip.appendChild(time);
                    tooltip.appendChild(value);
                    tooltip.hidden = false;
                    var width = tooltip.offsetWidth;
                    var left = x + slot / 2 - width / 2;
                    left = Math.max(0, Math.min(W - width, left));
                    tooltip.style.left = left + "px";
                    tooltip.style.top = "0px";
                });
                zone.addEventListener("mouseleave", function () {
                    bar.setAttribute("opacity", 0.85);
                    tooltip.hidden = true;
                });
                svg.appendChild(zone);
            });
        }

        function renderCards() {
            var now = state.now;
            var day = state.times.filter(function (t) { return t >= now - DAY; }).length;
            var week = state.times.filter(function (t) { return t >= now - 7 * DAY; }).length;
            var items = [
                ["За 24 часа", day],
                ["За 7 дней", week],
                ["Активных сейчас", state.active],
                ["Всего за 30 дней", state.total]
            ];
            var host = document.getElementById("cards");
            host.textContent = "";
            items.forEach(function (item) {
                var box = document.createElement("div");
                box.className = "stat";
                var label = document.createElement("div");
                label.className = "stat-label";
                label.textContent = item[0];
                var value = document.createElement("div");
                value.className = "stat-value";
                value.textContent = item[1];
                box.appendChild(label);
                box.appendChild(value);
                host.appendChild(box);
            });
        }

        function renderRows() {
            var body = document.getElementById("rows");
            body.textContent = "";
            document.getElementById("empty").hidden = state.recent.length > 0;
            state.recent.forEach(function (item) {
                var row = document.createElement("tr");

                var codeCell = document.createElement("td");
                codeCell.className = "mono";
                codeCell.textContent = item.code;

                var passCell = document.createElement("td");
                var passBox = document.createElement("div");
                passBox.className = "pass-cell";
                var passText = document.createElement("span");
                passText.className = "mono";
                passText.textContent = item.password;
                var copy = document.createElement("button");
                copy.className = "copy";
                copy.type = "button";
                copy.textContent = "Копировать";
                copy.addEventListener("click", function () {
                    navigator.clipboard.writeText(item.password).then(function () {
                        copy.textContent = "Скопировано";
                        setTimeout(function () { copy.textContent = "Копировать"; }, 1200);
                    });
                });
                passBox.appendChild(passText);
                passBox.appendChild(copy);
                passCell.appendChild(passBox);

                var createdCell = document.createElement("td");
                createdCell.textContent = formatDate(item.createdAt);

                var expiresCell = document.createElement("td");
                expiresCell.textContent = formatDate(item.expiresAt);

                var statusCell = document.createElement("td");
                var badge = document.createElement("span");
                badge.className = "badge " + item.status;
                badge.textContent = STATUS_LABELS[item.status] || item.status;
                statusCell.appendChild(badge);

                row.appendChild(codeCell);
                row.appendChild(passCell);
                row.appendChild(createdCell);
                row.appendChild(expiresCell);
                row.appendChild(statusCell);
                body.appendChild(row);
            });
        }

        function renderAll() {
            renderCards();
            drawChart();
            renderRows();
            document.getElementById("updated").textContent = "Обновлено: " + formatDate(Date.now());
        }

        async function load() {
            var response = await fetch(WORKER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "dashboard", password: password })
            });
            var result = await response.json();
            if (!response.ok || !result.success) {
                var err = new Error(result.error || "Ошибка");
                err.status = response.status;
                throw err;
            }
            state.now = result.now;
            state.times = result.times;
            state.recent = result.recent;
            state.active = result.active;
            state.total = result.total;
            renderAll();
        }

        function logout() {
            if (timer) clearInterval(timer);
            timer = null;
            password = "";
            dash.hidden = true;
            lockBox.hidden = false;
            input.value = "";
            input.focus();
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            if (!input.value) return;
            button.disabled = true;
            errorBox.textContent = "";
            password = input.value;
            try {
                await load();
                lockBox.hidden = true;
                dash.hidden = false;
                drawChart();
                timer = setInterval(function () {
                    load().catch(function (e) {
                        if (e.status === 403) logout();
                    });
                }, REFRESH_MS);
            } catch (e) {
                password = "";
                errorBox.textContent = e.status ? e.message : "Не удалось связаться с сервером";
                input.value = "";
                input.focus();
            }
            button.disabled = false;
        });

        document.getElementById("logout").addEventListener("click", logout);

        document.getElementById("tabs").addEventListener("click", function (event) {
            var target = event.target.closest(".tab");
            if (!target) return;
            state.range = target.getAttribute("data-range");
            document.querySelectorAll(".tab").forEach(function (el) {
                el.classList.toggle("active", el === target);
            });
            drawChart();
        });

        window.addEventListener("resize", function () {
            if (!dash.hidden) drawChart();
        });
    </script>
</body>
</html>
