<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница 2R8K88</title>
    <style>
        :root {
            --bg-base: #0C0D0E;
            --bg-surface: #131517;
            --bg-hover: #1B1E21;
            --text-primary: #e2e5ed;
            --text-secondary: #8b90a0;
            --text-muted: #555970;
            --accent: #8b90a0;
            --accent-soft: rgba(139, 144, 160, 0.14);
            --border: rgba(255, 255, 255, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        ::selection {
            background: #8b90a0;
            color: #fff;
        }

        ::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background-color: rgba(139, 144, 160, 0.3);
            background-clip: content-box;
            border: 4px solid transparent;
            border-radius: 8px;
            min-height: 44px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(139, 144, 160, 0.55);
            background-clip: content-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
            color: var(--text-primary);
            font-family: "Segoe UI", sans-serif;
        }

        .topbar {
            display: flex;
            align-items: center;
            height: 32px;
            padding: 0 22px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            flex: none;
        }

        .brand-name {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .view {
            flex: 1;
            min-height: 0;
            display: flex;
            overflow-y: auto;
            padding: 22px 22px 56px;
        }

        .card {
            width: 100%;
            max-width: 640px;
            margin: auto;
            padding: 40px 36px 28px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .card-label {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .code-title {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: 6px;
            line-height: 1.1;
            background: linear-gradient(100deg, #8b90a0 0%, #e2e5ed 20%, #ffffff 30%, #8b90a0 50%, #e2e5ed 70%, #ffffff 80%, #8b90a0 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .divider {
            height: 1px;
            margin: 28px 0;
            background: var(--border);
        }

        .data-section {
            text-align: left;
        }

        .data-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .data-box {
            padding: 16px 18px;
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: "Consolas", monospace;
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-secondary);
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .meta {
            margin-top: 22px;
            font-size: 12px;
            letter-spacing: 0.3px;
            color: var(--text-muted);
        }

        .version-label {
            position: fixed;
            left: 6px;
            bottom: 6px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            pointer-events: none;
            user-select: none;
        }

        @media (max-width: 520px) {
            .card {
                padding: 28px 20px 20px;
            }

            .code-title {
                font-size: 38px;
                letter-spacing: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <span class="brand-name">MOOLONIC</span>
    </div>
    <main class="view">
        <section class="card">
            <div class="card-label">Страница</div>
            <h1 class="code-title">2R8K88</h1>
            <div class="divider"></div>
            <div class="data-section">
                <div class="data-title">Данные из C++</div>
                <div class="data-box">ПривесE Это данные из C++ программсE СтатусEсE�сE�емсE OK. ВерсE�сE 1.0.5</div>
            </div>
            <div class="meta">Создано: 16.10.2026, 14:05:26</div>
        </section>
    </main>
    <div class="version-label">Moolonic</div>
</body>
</html>
