<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница XbFrQaAwlSUN</title>
    <style>
        :root {
            --bg-base: #0C0D0E;
            --bg-surface: #131517;
            --bg-hover: #1B1E21;
            --text-primary: #e2e5ed;
            --text-secondary: #8b90a0;
            --text-muted: #555970;
            --accent: #8b90a0;
            --accent-soft: rgba(139, 144, 160, 0.14);
            --border: rgba(255, 255, 255, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        [hidden] {
            display: none !important;
        }

        ::selection {
            background: #8b90a0;
            color: #fff;
        }

        ::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background-color: rgba(139, 144, 160, 0.3);
            background-clip: content-box;
            border: 4px solid transparent;
            border-radius: 8px;
            min-height: 44px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(139, 144, 160, 0.55);
            background-clip: content-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
            color: var(--text-primary);
            font-family: "Segoe UI", sans-serif;
        }

        .page-badge {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 60;
            padding: 8px 18px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-primary);
            white-space: nowrap;
        }

        .view {
            flex: 1;
            min-height: 0;
            display: flex;
            overflow-y: auto;
            padding: 80px 22px 56px;
        }

        .card {
            width: 100%;
            max-width: 640px;
            margin: auto;
            padding: 32px 36px 28px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .lock-card {
            max-width: 380px;
            text-align: center;
        }

        .data-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .lock-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 18px;
        }

        .lock-input {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: "Consolas", monospace;
            font-size: 18px;
            letter-spacing: 6px;
            text-align: center;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.15s;
        }

        .lock-input:focus {
            border-color: var(--accent);
        }

        .lock-button {
            padding: 11px 14px;
            background: var(--accent-soft);
            border: 1px solid var(--accent);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #fff;
            cursor: pointer;
            transition: background 0.15s;
        }

        .lock-button:hover {
            background: rgba(139, 144, 160, 0.26);
        }

        .lock-button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .lock-error {
            min-height: 18px;
            margin-top: 12px;
            font-size: 13px;
            color: #ff7a6e;
        }

        .data-box {
            padding: 16px 18px;
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: "Consolas", monospace;
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-secondary);
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .meta {
            margin-top: 22px;
            font-size: 12px;
            letter-spacing: 0.3px;
            color: var(--text-muted);
        }

        .version-label {
            position: fixed;
            left: 50%;
            bottom: 6px;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
        }

        @media (max-width: 520px) {
            .card {
                padding: 24px 20px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="page-badge">Страница #XbFrQaAwlSUN</div>
    <main class="view">
        <section class="card lock-card" id="lock">
            <div class="data-title">Введите пароль</div>
            <form class="lock-form" id="lock-form">
                <input class="lock-input" id="password" type="password" maxlength="6" autocomplete="off" autofocus>
                <button class="lock-button" id="unlock" type="submit">Открыть</button>
            </form>
            <div class="lock-error" id="error"></div>
        </section>
        <section class="card" id="content" hidden>
            <div class="data-title">Данные из C++</div>
            <div class="data-box" id="data"></div>
            <div class="meta" id="meta"></div>
        </section>
    </main>
    <div class="version-label">Moolonic Cloude</div>
    <script type="application/json" id="payload">{"salt":"JfSpdVFZl1Ag8W3w85OPxA==","iv":"rWFDBBPkXM8H0nw/","data":"Hs4BRczoH7DG5rtHD1HWEsYN/RbheEYqxYmiHcVn2sL9OT92v88CRWP41JV5iKlzlNApN+0g9gVg3hXOhsWfd2Sh61AVNYNd+Yz8i4JJsaQUL879PcFYlo/ia94tbTHxDErWo69OkrdRoHg4eDD6xl/7Dnv3Q0WlCPS/YXq9PGYDGrLzNqTIKt0FtejX4bSOydc+UXGGXWO9loFKQmj5gHaOtV57VNBV/1DG42Zf3h2c"}</script>
    <script>
        var payload = JSON.parse(document.getElementById("payload").textContent);
        var form = document.getElementById("lock-form");
        var input = document.getElementById("password");
        var button = document.getElementById("unlock");
        var errorBox = document.getElementById("error");

        function fromBase64(value) {
            return Uint8Array.from(atob(value), function (c) { return c.charCodeAt(0); });
        }

        async function decryptPayload(password) {
            var encoder = new TextEncoder();
            var baseKey = await crypto.subtle.importKey("raw", encoder.encode(password), "PBKDF2", false, ["deriveKey"]);
            var key = await crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: fromBase64(payload.salt), iterations: 100000, hash: "SHA-256" },
                baseKey,
                { name: "AES-GCM", length: 256 },
                false,
                ["decrypt"]
            );
            var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromBase64(payload.iv) }, key, fromBase64(payload.data));
            return JSON.parse(new TextDecoder().decode(plain));
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            if (!input.value) return;
            button.disabled = true;
            errorBox.textContent = "";
            try {
                var result = await decryptPayload(input.value);
                document.getElementById("data").textContent = result.data;
                document.getElementById("meta").textContent = "Создано: " + result.createdAt;
                document.getElementById("lock").hidden = true;
                document.getElementById("content").hidden = false;
            } catch (e) {
                errorBox.textContent = "Неверный пароль";
                input.value = "";
                input.focus();
            }
            button.disabled = false;
        });
    </script>
</body>
</html>
