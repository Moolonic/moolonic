<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="expires-at" content="1792321534149">
    <title>Страница qyP9AOu6wdsV</title>
    <style>
        :root {
            --bg-base: #0C0D0E;
            --bg-surface: #131517;
            --bg-hover: #1B1E21;
            --text-primary: #e2e5ed;
            --text-secondary: #8b90a0;
            --text-muted: #555970;
            --accent: #8b90a0;
            --accent-soft: rgba(139, 144, 160, 0.14);
            --border: rgba(255, 255, 255, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        [hidden] {
            display: none !important;
        }

        ::selection {
            background: #8b90a0;
            color: #fff;
        }

        ::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background-color: rgba(139, 144, 160, 0.3);
            background-clip: content-box;
            border: 4px solid transparent;
            border-radius: 8px;
            min-height: 44px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(139, 144, 160, 0.55);
            background-clip: content-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
            color: var(--text-primary);
            font-family: "Segoe UI", sans-serif;
        }

        .page-badge {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 60;
            padding: 8px 18px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-primary);
            white-space: nowrap;
        }

        .view {
            flex: 1;
            min-height: 0;
            display: flex;
            overflow-y: auto;
            padding: 80px 22px 56px;
        }

        .account-panel {
            max-width: 720px;
            width: 100%;
            margin: auto;
            padding: 24px 26px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 14px;
        }

        .lock-panel {
            max-width: 380px;
            text-align: center;
        }

        .panel-title {
            font-size: 18px;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
            overflow-wrap: anywhere;
        }

        .panel-sub {
            font-family: "Consolas", monospace;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .account-head {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .account-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg-base);
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 1px;
            text-align: center;
            color: var(--text-secondary);
            margin: 20px 0 10px;
        }

        .section-title::before,
        .section-title::after {
            content: "";
            flex: 1 1 auto;
            max-width: 200px;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--border));
        }

        .section-title::after {
            background: linear-gradient(to left, transparent, var(--border));
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
        }

        .profile-cell {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 10px 12px;
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .profile-label {
            font-size: 10px;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .profile-value {
            font-family: "Consolas", monospace;
            font-size: 16px;
            color: var(--text-primary);
            overflow-wrap: anywhere;
        }

        .lock-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 18px;
        }

        .lock-input {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: "Consolas", monospace;
            font-size: 18px;
            letter-spacing: 6px;
            text-align: center;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.15s;
        }

        .lock-input:focus {
            border-color: var(--accent);
        }

        .lock-button {
            padding: 11px 14px;
            background: var(--accent-soft);
            border: 1px solid var(--accent);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #fff;
            cursor: pointer;
            transition: background 0.15s;
        }

        .lock-button:hover {
            background: rgba(139, 144, 160, 0.26);
        }

        .lock-button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .lock-error {
            min-height: 18px;
            margin-top: 12px;
            font-size: 13px;
            color: #ff7a6e;
        }

        .meta {
            margin-top: 22px;
            font-size: 12px;
            letter-spacing: 0.3px;
            line-height: 1.6;
            color: var(--text-muted);
        }

        .expired-text {
            margin-top: 8px;
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-secondary);
            text-align: center;
        }

        .version-label {
            position: fixed;
            left: 50%;
            bottom: 6px;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
        }

        @media (max-width: 720px) {
            .profile-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 520px) {
            .account-panel {
                padding: 20px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="page-badge">Страница #qyP9AOu6wdsV</div>
    <main class="view">
        <section class="account-panel lock-panel" id="lock">
            <h2 class="panel-title">Введите пароль</h2>
            <form class="lock-form" id="lock-form">
                <input class="lock-input" id="password" type="password" maxlength="6" autocomplete="off" autofocus>
                <button class="lock-button" id="unlock" type="submit">Открыть</button>
            </form>
            <div class="lock-error" id="error"></div>
        </section>
        <section class="account-panel" id="content" hidden>
            <div class="account-head">
                <img class="account-avatar" id="avatar" alt="" referrerpolicy="no-referrer" hidden>
                <div>
                    <h2 class="panel-title" id="nickname">—</h2>
                    <p class="panel-sub" id="uid"></p>
                </div>
            </div>
            <div id="sections"></div>
            <p class="meta" id="meta"></p>
        </section>
        <section class="account-panel lock-panel" id="expired" hidden>
            <h2 class="panel-title">Страница недоступна</h2>
            <p class="expired-text">Срок жизни страницы истёк, она удалена.</p>
        </section>
    </main>

    <script type="application/json" id="payload">{"salt":"0vk0mJVsw+Accm3W4CE+DA==","iv":"sPAu5X7Vxlk8pPCU","data":"ieTt1DWHeG/3cwmOABhr1ZzdRXGmModmJp03V3G1ZLNtD3Q+Qfh30lcjnfIwigHlH7SQJeR9Sn7c0lmM8IrrrmG/w3Q8NpcOSOTaScQq9MWOtKi4hAEix2mu3NukzKj6rvzHHa8u3O7Ad+DNSzLsN31/hTalTJO1isL9760rMX6IxcgTgB6pRvqvt9vEG3N+KiY1e1xhfEX9fO9n8rNcw/7UaPxmKeFxDkbaGQ/PWZwuED5NxuyBWsLDmYGxo7/SJrOwtSEOoSqJHfklNR7drYjUr7HnAZ8jM096qMhioxlXs+atqyVoYpnAkqcahhLwFCLzvTe9BTxh8xeFUjgC9L6KTVD1jreyyK7oGCKQv8gqxj254k6sDiWmze0oH6dM0lmFpa5nSCy520HaPTiQjE8N3QrfvYprs/qeYqt2HzHomdJS9h9IyTSYgRbjn1TdrulN7FZnHy6aii72G1rzd+Vg2A8zIME+8a2FwxkQatMqwJam+kF6D8gT90Gm4gf7xElMIXNdT3Op5tLNN+X0ZqIMiytzx4Qd/Tb0i6ezZJqgcM3isvNiQ3nP8al17NqKkeDUbk605fN1gRD2ChPQ1xiTynBny8xcQwAAKeBR3HbcC0vnlYXYVwtLSRJT56yhyB/d2bH+v1VEO5/cnpazccma5swJFE0nu3O8aDrA9k5AWgQHT7LSPTyCKCL4U+jNBPjuEIunoorbdGB8C9bC+ezUMdFbLaaSAYEnwHodR4BtiW2BmhKX/CSxed3nLte7id29UqnVuC07WBFTJ8orGrWt2KSnEztxwyg+F3FKcoC7sGBuZKjNwiC9u5QflDdaKpBrnJf0ztzjA7pnt0U5Q35zQZulgWDdBXnEVkGeWALlJEIQAcIwW1+eCRltlqx0zeOCZPI3i4ovI42IA9JK86hNUfeD0xdrpC7W0CXP16Vvz6GL7AMoIg=="}</script>
    <script>
        var REFRESH_MS = 6 * 60 * 1000;
        var SECTIONS = [
            { title: "Профиль", cells: [
                ["Ранг приключений", "ar"],
                ["Уровень мира", "worldLevel"],
                ["Дней в игре", "activeDays"],
                ["Первородная смола", "resin"],
                ["Достижений", "achievements"],
                ["Персонажей", "characterCount"],
                ["Витая Бездна", "spiralAbyss"],
                ["Драгоц. сундуки", "preciousChest"],
                ["Роскошн. сундуки", "luxuriousChest"],
                ["Изящн. сундуки", "exquisiteChest"],
                ["Обычн. сундуки", "commonChest"],
                ["Магич. сундуки", "magicChest"],
                ["Телепорты", "waypoints"],
                ["Подземелья", "domains"]
            ] },
            { title: "Окулы", cells: [
                ["Анемокул", "anemoculus"],
                ["Геокул", "geoculus"],
                ["Электрокул", "electroculus"],
                ["Дендрокул", "dendroculus"],
                ["Гидрокул", "hydroculus"],
                ["Пирокул", "pyroculus"],
                ["Криокул", "iceculus"],
                ["Лунокул", "moonoculus"]
            ] },
            { title: "Чайник Безмятежности", cells: [
                ["Уровень доверия", "teapotLevel"],
                ["Сила Адептов", "teapotComfort"],
                ["Получено украшений", "teapotItems"],
                ["Гостей за всё время", "teapotVisits"]
            ] }
        ];

        var payload = JSON.parse(document.getElementById("payload").textContent);
        var expiresAt = Number(document.querySelector('meta[name="expires-at"]').getAttribute("content"));
        var password = "";
        var refreshTimer = null;
        var expiryTimer = null;

        var form = document.getElementById("lock-form");
        var input = document.getElementById("password");
        var button = document.getElementById("unlock");
        var errorBox = document.getElementById("error");

        function fromBase64(value) {
            return Uint8Array.from(atob(value), function (c) { return c.charCodeAt(0); });
        }

        async function decryptPayload(pass, source) {
            var encoder = new TextEncoder();
            var baseKey = await crypto.subtle.importKey("raw", encoder.encode(pass), "PBKDF2", false, ["deriveKey"]);
            var key = await crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: fromBase64(source.salt), iterations: 100000, hash: "SHA-256" },
                baseKey,
                { name: "AES-GCM", length: 256 },
                false,
                ["decrypt"]
            );
            var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromBase64(source.iv) }, key, fromBase64(source.data));
            return JSON.parse(new TextDecoder().decode(plain));
        }

        function formatTime(ms) {
            return new Date(ms).toLocaleString("ru-RU");
        }

        function render(result) {
            var data = result.data || {};
            document.getElementById("nickname").textContent = data.nickname || "—";
            document.getElementById("uid").textContent = data.uid ? "UID: " + data.uid : "";
            var avatar = document.getElementById("avatar");
            if (data.avatarUrl) {
                avatar.onerror = function () { avatar.hidden = true; };
                avatar.src = data.avatarUrl;
                avatar.hidden = false;
            } else {
                avatar.hidden = true;
            }
            var host = document.getElementById("sections");
            host.textContent = "";
            SECTIONS.forEach(function (section) {
                var title = document.createElement("h3");
                title.className = "section-title";
                title.textContent = section.title;
                var grid = document.createElement("div");
                grid.className = "profile-grid";
                section.cells.forEach(function (cell) {
                    var box = document.createElement("div");
                    box.className = "profile-cell";
                    var label = document.createElement("span");
                    label.className = "profile-label";
                    label.textContent = cell[0];
                    var value = document.createElement("span");
                    value.className = "profile-value";
                    var raw = data[cell[1]];
                    value.textContent = (raw === undefined || raw === null || raw === "") ? "—" : raw;
                    box.appendChild(label);
                    box.appendChild(value);
                    grid.appendChild(box);
                });
                host.appendChild(title);
                host.appendChild(grid);
            });
            document.getElementById("meta").textContent =
                "Обновлено: " + formatTime(result.updatedAt) + ". Страница будет удалена: " + formatTime(expiresAt) + ".";
        }

        function showExpired() {
            if (refreshTimer) clearInterval(refreshTimer);
            if (expiryTimer) clearInterval(expiryTimer);
            password = "";
            document.getElementById("lock").hidden = true;
            document.getElementById("content").hidden = true;
            document.getElementById("expired").hidden = false;
        }

        async function refresh() {
            if (Date.now() >= expiresAt) {
                showExpired();
                return;
            }
            try {
                var response = await fetch(location.href.split("?")[0] + "?t=" + Date.now(), { cache: "no-store" });
                if (response.status === 404) {
                    showExpired();
                    return;
                }
                if (!response.ok) return;
                var doc = new DOMParser().parseFromString(await response.text(), "text/html");
                var node = doc.getElementById("payload");
                var meta = doc.querySelector('meta[name="expires-at"]');
                if (!node) return;
                var fresh = JSON.parse(node.textContent);
                var result = await decryptPayload(password, fresh);
                payload = fresh;
                if (meta) expiresAt = Number(meta.getAttribute("content"));
                render(result);
            } catch (e) {}
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            if (!input.value) return;
            button.disabled = true;
            errorBox.textContent = "";
            try {
                var result = await decryptPayload(input.value, payload);
                password = input.value;
                render(result);
                document.getElementById("lock").hidden = true;
                document.getElementById("content").hidden = false;
                refreshTimer = setInterval(refresh, REFRESH_MS);
                expiryTimer = setInterval(function () {
                    if (Date.now() >= expiresAt) showExpired();
                }, 30000);
            } catch (e) {
                errorBox.textContent = "Неверный пароль";
                input.value = "";
                input.focus();
            }
            button.disabled = false;
        });

        if (Date.now() >= expiresAt) showExpired();
    </script>
</body>
